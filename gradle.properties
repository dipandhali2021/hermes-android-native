org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# The build cache stores a second full copy of every task output under
# ~/.gradle/caches/build-cache-1 (~1 GB for an Android app). On a workstation
# that is nearly out of disk that is pure cost for a single-developer project,
# so it stays off; CI re-runs cheaply from its own warm cache instead.
org.gradle.caching=false
org.gradle.daemon=false
org.gradle.workers.max=2

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
