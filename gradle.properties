org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# The build cache is left off here because it stores a second full copy of every
# task output under ~/.gradle/caches/build-cache-1 (roughly 1 GB for an Android
# app), which is a real cost on a disk-constrained workstation. CI opts in with
# --build-cache, where the space is free and the reuse is worth it.
org.gradle.workers.max=2

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
